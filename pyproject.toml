[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docxops"
version = "0.1.0"
description = "Word (.docx) structure operations for LLM agents: real TOC, headings, captions, cross-references, sections."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.1",
    "docxcompose>=1.4",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
